document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"6d29a10d-fef0-4702-9dcc-c9c47a993ff7\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* Momentum colour. One ink, one canvas, one accent family per goal.\n   Neutrals are ALWAYS the ink at an alpha — never a separate grey. */\n:root{\n  /* — Ink and canvas — */\n  --ink:#0B0C0E;\n  --ink-68:rgba(11,12,14,.68);\n  --ink-62:rgba(11,12,14,.62);\n  --ink-55:rgba(11,12,14,.55);\n  --ink-50:rgba(11,12,14,.5);\n  --ink-45:rgba(11,12,14,.45);\n  --ink-42:rgba(11,12,14,.42);\n  --ink-40:rgba(11,12,14,.4);\n  --ink-38:rgba(11,12,14,.38);\n  --ink-35:rgba(11,12,14,.35);\n  --ink-32:rgba(11,12,14,.32);\n  --ink-30:rgba(11,12,14,.3);\n  --ink-16:rgba(11,12,14,.16);\n  --ink-14:rgba(11,12,14,.14);\n  --ink-12:rgba(11,12,14,.12);\n  --ink-10:rgba(11,12,14,.1);\n  --ink-09:rgba(11,12,14,.09);\n  --ink-08:rgba(11,12,14,.08);\n  --ink-07:rgba(11,12,14,.07);\n  --ink-06:rgba(11,12,14,.06);\n  --canvas:#F4F6F7;\n  --white:#ffffff;\n\n  /* — Teal · default accent (Exercise, Dutch, Cycling) — */\n  --teal-light:#7FE3FA;\n  --teal-glow:#5ED2F0;\n  --teal-bright:#33B9DE;\n  --teal-hero:#2FB6DC;\n  --teal:#0A7EA4;\n  --teal-mid:#2A7FA8;\n  --teal-pale:#7FD3EC;\n  --teal-deep:#05435A;\n  --teal-shade:#064A62;\n  --teal-shade-2:#065A76;\n  --teal-ink:#06485E;\n  --teal-12:rgba(10,126,164,.12);\n  --teal-20:rgba(10,126,164,.2);\n\n  /* — Amber · secondary accent — */\n  --amber-light:#FFC28A;\n  --amber-light-2:#FFC98A;\n  --amber:#D0682E;\n  --amber-deep:#7A3410;\n  --amber-warn:#C2542A;\n\n  /* — Violet · secondary accent — */\n  --violet-light:#E7B7F0;\n  --violet:#8A4FA0;\n  --violet-deep:#4A2359;\n\n  /* — Dark surfaces — */\n  --dark-top:#123543;\n  --dark-base:#061219;\n  --dark-island:#08131A;\n  --dark-ground:#0B0C0E;\n  --dark-teal:#22A7D0;\n  --dark-teal-figure:#8FE0F5;\n  --dark-warm:#FF8A5B;\n\n  /* — Glass — */\n  --glass-82:rgba(255,255,255,.82);\n  --glass-80:rgba(255,255,255,.8);\n  --glass-78:rgba(255,255,255,.78);\n  --glass-66:rgba(255,255,255,.66);\n  --glass-62:rgba(255,255,255,.62);\n  --glass-60:rgba(255,255,255,.6);\n  --glass-58:rgba(255,255,255,.58);\n  --glass-55:rgba(255,255,255,.55);\n  --hairline-95:rgba(255,255,255,.95);\n  --hairline-90:rgba(255,255,255,.9);\n  --hairline-88:rgba(255,255,255,.88);\n  --hairline-85:rgba(255,255,255,.85);\n  --hairline-80:rgba(255,255,255,.8);\n  --on-dark-12:rgba(255,255,255,.12);\n  --on-dark-14:rgba(255,255,255,.14);\n  --on-dark-16:rgba(255,255,255,.16);\n  --on-dark-18:rgba(255,255,255,.18);\n  --on-dark-22:rgba(255,255,255,.22);\n  --on-dark-45:rgba(255,255,255,.45);\n  --on-dark-55:rgba(255,255,255,.55);\n  --on-dark-60:rgba(255,255,255,.6);\n  --on-dark-72:rgba(255,255,255,.72);\n  --on-dark-78:rgba(255,255,255,.78);\n  --on-dark-80:rgba(255,255,255,.8);\n\n  /* — Gradients — */\n  --grad-hero:linear-gradient(168deg,#2FB6DC 0%,#0A7EA4 52%,#064A62 100%); /* @kind color */\n  --grad-card:linear-gradient(168deg,#33B9DE 0%,#0A7EA4 58%,#065A76 100%); /* @kind color */\n  --grad-art:linear-gradient(168deg,#33B9DE 0%,#0A7EA4 56%,#05435A 100%); /* @kind color */\n  --grad-tile:linear-gradient(160deg,#33B9DE,#0A7EA4); /* @kind color */\n  --grad-tile-amber:linear-gradient(160deg,#FFC28A,#D0682E); /* @kind color */\n  --grad-tile-teal-mid:linear-gradient(160deg,#8FD3EE,#2A7FA8); /* @kind color */\n  --grad-dark:linear-gradient(168deg,#123543,#061219); /* @kind color */\n  --grad-arc:linear-gradient(135deg,#7FE3FA 0%,#0A7EA4 60%,#05435A 100%); /* @kind color */\n\n  /* — Background blooms (light canvas only) — */\n  --bloom-teal:radial-gradient(closest-side,rgba(34,167,208,.42),rgba(244,246,247,0)); /* @kind color */\n  --bloom-teal-soft:radial-gradient(closest-side,rgba(34,167,208,.22),rgba(244,246,247,0)); /* @kind color */\n  --bloom-warm:radial-gradient(closest-side,rgba(255,138,91,.26),rgba(244,246,247,0)); /* @kind color */\n\n  /* — Semantic aliases — */\n  --text-primary:var(--ink);\n  --text-body:var(--ink-62);\n  --text-secondary:var(--ink-50);\n  --text-tertiary:var(--ink-42);\n  --text-quiet:var(--ink-32);\n  --text-accent:var(--teal);\n  --text-warn:var(--amber-warn);\n  --text-on-dark:var(--white);\n  --text-on-dark-secondary:var(--on-dark-60);\n\n  --surface-canvas:var(--canvas);\n  --surface-glass:var(--glass-62);\n  --surface-glass-strong:var(--glass-78);\n  --surface-sheet:var(--glass-80);\n  --surface-hero:var(--grad-hero);\n  --surface-dark:var(--grad-dark);\n  --surface-island:var(--dark-island);\n\n  --border-glass:var(--hairline-85);\n  --border-glass-bright:var(--hairline-95);\n  --border-rule:var(--ink-09);\n  --border-rule-soft:var(--ink-08);\n\n  --accent:var(--teal);\n  --accent-wash:var(--teal-12);\n  --accent-on-dark:var(--teal-glow);\n  --control-secondary:var(--ink-07);\n  --control-secondary-hover:var(--ink-14);\n  --track:var(--ink-10);\n  --track-on-dark:var(--on-dark-18);\n}\n\n/* Momentum type. SF Pro throughout. Display sizes take negative tracking\n   that tightens as they grow; the caps label is the only styled small text.\n   Numbers are ALWAYS tabular. */\n:root{\n  --font-display:-apple-system,'SF Pro Display','SF Pro Text','Inter',system-ui,sans-serif;\n  --font-text:-apple-system,'SF Pro Text','SF Pro Display','Inter',system-ui,sans-serif;\n  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;\n\n  --weight-regular:400; /* @kind other */\n  --weight-medium:500; /* @kind other */\n  --weight-semibold:600; /* @kind other */\n  --weight-bold:700; /* @kind other */\n  --weight-heavy:800; /* @kind other */\n\n  /* Session clock — 66/800/-.055em */\n  --type-clock-size:66px;\n  --type-clock-weight:800; /* @kind other */\n  --type-clock-track:-.055em; /* @kind other */\n  --type-clock-leading:.98; /* @kind other */\n\n  /* Page title — 46/800/-.04em */\n  --type-title-size:46px;\n  --type-title-weight:800; /* @kind other */\n  --type-title-track:-.04em; /* @kind other */\n  --type-title-leading:1.02; /* @kind other */\n\n  /* Clock on dark — 34/800/-.045em */\n  --type-clock-dark-size:34px;\n  --type-clock-dark-weight:800; /* @kind other */\n  --type-clock-dark-track:-.045em; /* @kind other */\n\n  /* Screen heading — 28/800/-.038em */\n  --type-heading-size:28px;\n  --type-heading-weight:800; /* @kind other */\n  --type-heading-track:-.038em; /* @kind other */\n  --type-heading-leading:1.06; /* @kind other */\n\n  /* Card title — 19/700/-.025em */\n  --type-card-size:19px;\n  --type-card-weight:700; /* @kind other */\n  --type-card-track:-.025em; /* @kind other */\n\n  /* Row name — 15/600/-.015em */\n  --type-row-size:15px;\n  --type-row-weight:600; /* @kind other */\n  --type-row-track:-.015em; /* @kind other */\n\n  /* Button label — 14/700 */\n  --type-button-size:14px;\n  --type-button-weight:700; /* @kind other */\n  --type-button-track:-.01em; /* @kind other */\n\n  /* Body, sub-line — 13.5/400 at ink 50% */\n  --type-body-size:13.5px;\n  --type-body-weight:400; /* @kind other */\n  --type-body-leading:1.45; /* @kind other */\n\n  /* Caps label — 11.5/700/.13em at ink 42% */\n  --type-caps-size:11.5px;\n  --type-caps-weight:700; /* @kind other */\n  --type-caps-track:.13em; /* @kind other */\n\n  --numeric:tabular-nums; /* @kind other */\n}\n\n/* Momentum spacing. Screen gutter 20-24px. Section rhythm 26px.\n   Card padding 14-20px. Row gap 9-12px. List rows separate with a\n   1px ink-.09 rule, never a gap. */\n:root{\n  --space-1:2px;\n  --space-2:4px;\n  --space-3:6px;\n  --space-4:8px;\n  --space-5:10px;\n  --space-6:12px;\n  --space-7:14px;\n  --space-8:16px;\n  --space-9:18px;\n  --space-10:20px;\n  --space-11:22px;\n  --space-12:24px;\n  --space-13:26px;\n  --space-14:28px;\n\n  --gutter:18px;          /* screen edge on the glass build */\n  --gutter-wide:24px;     /* status bar / settings header */\n  --section-rhythm:26px;\n  --card-padding:18px;\n  --card-padding-lg:24px;\n  --row-gap:10px;\n  --stack-gap:12px;\n  --dock-inset-bottom:26px;\n  --hit-target:44px; /* @kind spacing */\n\n  --screen-width:402px; /* @kind spacing */\n  --screen-height:874px; /* @kind spacing */\n}\n\n/* Momentum radii. Every button is a pill. */\n:root{\n  --radius-pill:99px;   /* buttons, chips, toggles, nav */\n  --radius-sheet:36px;  /* bottom sheet top corners, dock */\n  --radius-dock:36px;\n  --radius-hero:30px;   /* hero / balance gradient card */\n  --radius-art:34px;    /* square session artwork */\n  --radius-lockscreen:28px;\n  --radius-card:26px;   /* widget, glass card */\n  --radius-row:24px;    /* glass list row */\n  --radius-tile:20px;   /* stat tile */\n  --radius-swatch:13px; /* goal swatch */\n  --radius-swatch-sm:11px;\n  --radius-badge:6px;\n  --radius-track:5px;   /* progress track */\n}\n\n/* Momentum elevation. Glass panels carry a 1px near-white top edge —\n   that edge, not the shadow, is what makes them read as glass. */\n:root{\n  --shadow-dock:0 18px 42px rgba(8,40,52,.16);\n  --shadow-dark-card:0 14px 34px rgba(6,26,34,.3);\n  --shadow-transport:0 14px 32px rgba(11,12,14,.3);\n  --shadow-widget:0 6px 20px rgba(11,40,50,.1);\n  --shadow-pill:0 5px 16px rgba(11,40,50,.09);\n  --shadow-glass-row:0 4px 18px rgba(11,40,50,.07);\n  --shadow-hero:0 18px 44px rgba(10,80,105,.28);\n  --shadow-sheet:0 -20px 60px rgba(8,40,52,.22);\n  --shadow-knob:0 2px 6px rgba(11,40,50,.24);\n  --shadow-ink-pill:0 10px 28px rgba(11,12,14,.28);\n  --shadow-inset-specular:0 1px 0 rgba(255,255,255,.95) inset;\n\n  --blur-panel:blur(24px) saturate(1.6); /* @kind other */\n  --blur-panel-strong:blur(28px) saturate(1.7); /* @kind other */\n  --blur-dock:blur(30px) saturate(1.8); /* @kind other */\n  --blur-sheet:blur(36px) saturate(1.8); /* @kind other */\n  --blur-tile:blur(24px) saturate(1.7); /* @kind other */\n}\n\n/* Momentum motion. One curve for anything that travels. */\n:root{\n  --ease-travel:cubic-bezier(.22,1,.36,1); /* @kind other */\n  --ease-zoom:cubic-bezier(.32,.72,0,1); /* @kind other */\n  --dur-opacity:380ms; /* @kind other */\n  --dur-transform:460ms; /* @kind other */\n  --dur-colour:220ms; /* @kind other */\n  --dur-zoom:620ms; /* @kind other */\n  --stagger-block:40ms; /* @kind other */\n  --pulse-duration:2s; /* @kind other */\n}\n@keyframes momentum-pulse{0%,100%{opacity:1}50%{opacity:.25}}\n\n/* Momentum ships no webfont binaries. The product is iOS-only and uses the\n   platform faces: SF Pro Display for anything 19px and up, SF Pro Text below.\n   On non-Apple platforms the stack falls back to Inter, then system-ui.\n   See readme.md > Typography for the substitution note. */\n:root{\n  --font-stack-display:-apple-system,'SF Pro Display','SF Pro Text','Inter',system-ui,sans-serif;\n  --font-stack-text:-apple-system,'SF Pro Text','SF Pro Display','Inter',system-ui,sans-serif;\n}\n\n<\u002Fstyle>\n<script src=\"83171503-5182-4d7a-8f55-fe612c0eacc1\"><\u002Fscript>\n<script src=\"242e7d2e-b2f6-468e-9a0b-06685aae9e0f\"><\u002Fscript>\n<style>body{margin:0;background:#F4F6F7;color:#0B0C0E;font-family:var(--font-text);-webkit-font-smoothing:antialiased;overflow-x:hidden}a{color:#0A7EA4;text-decoration:none}a:hover{color:#05435A}<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"position:relative;min-height:100vh;background:#F4F6F7;color:#0B0C0E;overflow:hidden\">\n  <div style=\"position:absolute;left:-300px;top:-260px;width:900px;height:800px;border-radius:50%;background:rgba(34,167,208,.42);filter:blur(110px);pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:absolute;right:-360px;top:220px;width:800px;height:760px;border-radius:50%;background:rgba(255,138,91,.26);filter:blur(110px);pointer-events:none\"><\u002Fdiv>\n\n  <div style=\"position:sticky;top:0;z-index:5;padding:14px 18px\">\n    <div style=\"max-width:1160px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 8px 8px 20px;border-radius:99px;background:rgba(255,255,255,.58);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),0 18px 42px rgba(8,40,52,.1)\">\n      <div style=\"font-family:var(--font-display);font-size:19px;font-weight:800;letter-spacing:-.03em\">Callsign<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:22px;font-size:14px;font-weight:600;flex-wrap:wrap\">\n        <a href=\"#poses\" style=\"color:rgba(11,12,14,.62)\" style-hover=\"color:#0B0C0E\">How it stands<\u002Fa>\n        <a href=\"#signs\" style=\"color:rgba(11,12,14,.62)\" style-hover=\"color:#0B0C0E\">Signs<\u002Fa>\n        <a href=\"#pricing\" style=\"color:rgba(11,12,14,.62)\" style-hover=\"color:#0B0C0E\">Pricing<\u002Fa>\n        <x-import component-from-global-scope=\"MomentumDesignSystem_e7efaa.Button\" variant=\"primary\" hint-size=\"120px,44px\">Get the app<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <section style=\"position:relative;max-width:1160px;margin:0 auto;padding:56px 24px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:32px;align-items:center\">\n    <div style=\"display:flex;flex-direction:column;gap:22px\">\n      <x-import component-from-global-scope=\"MomentumDesignSystem_e7efaa.CapsLabel\" hint-size=\"160px,14px\">For iPhone Duo<\u002Fx-import>\n      <h1 style=\"margin:0;font-family:var(--font-display);font-size:clamp(46px,6.4vw,76px);font-weight:800;letter-spacing:-.05em;line-height:.98;text-wrap:balance\">Your Duo tells the room you’re on a call.<\u002Fh1>\n      <p style=\"margin:0;font-size:19px;line-height:1.45;color:rgba(11,12,14,.62);max-width:480px;text-wrap:pretty\">Fold it into a tent on your desk. Callsign updates automatically from your calendar and puts a sign on the outer display, so people know when to come in.<\u002Fp>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n        <x-import component-from-global-scope=\"MomentumDesignSystem_e7efaa.Button\" variant=\"primary\" hint-size=\"220px,44px\">Download on the App Store<\u002Fx-import>\n       <\u002Fdiv>\n      <div style=\"font-size:13.5px;color:rgba(11,12,14,.5)\">Free · Pro £6.99 · iOS 27 · optional free Mac app<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;display:flex;flex-direction:column;align-items:center;gap:14px\">\n      <div style=\"position:absolute;left:-40px;right:-40px;top:6%;bottom:18%;border-radius:36px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 30%,#000 80%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 30%,#000 80%,transparent 100%)\">\n        <div style=\"position:absolute;inset:-24px;filter:blur(14px) saturate(1.1);opacity:.85\"><image-slot id=\"hero-bg-person\" shape=\"rect\" placeholder=\"Person working on a laptop at a desk, shot from across the desk. Gets blurred.\"><\u002Fimage-slot><\u002Fdiv>\n        <div style=\"position:absolute;left:14px;top:40%;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.7);font-size:11.5px;font-weight:700;letter-spacing:.13em;color:rgba(11,12,14,.5);pointer-events:none\">BACKGROUND PHOTO · DROP HERE<\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-pointer-down=\"{{ swipe.down }}\" sc-camel-on-pointer-up=\"{{ swipe.up }}\" style=\"width:100%;max-width:600px;aspect-ratio:760/560;position:relative;cursor:grab;touch-action:pan-y;user-select:none\">\n        <div style=\"position:absolute;left:0;top:0;zoom:.79\"><dc-import name=\"DuoRender\" pose=\"tent\" sign=\"{{ hero.sign }}\" hint-size=\"760px,600px\"><\u002Fdc-import><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;align-items:center;padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.62);box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),0 5px 16px rgba(11,40,50,.09);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums\">\n        <div style=\"width:8px;height:8px;border-radius:99px;background:{{ hero.dot }}\"><\u002Fdiv>{{ hero.label }}\n      <\u002Fdiv>\n      <div style=\"position:relative;display:flex;gap:6px\">\n        <sc-for list=\"{{ dots }}\" as=\"d\" hint-placeholder-count=\"6\"><div sc-camel-on-click=\"{{ d.go }}\" style=\"width:{{ d.w }};height:8px;border-radius:99px;background:{{ d.bg }};cursor:pointer;transition:width 220ms ease,background 220ms ease\"><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"poses\" style=\"position:relative;max-width:1160px;margin:0 auto;padding:72px 24px;display:flex;flex-direction:column;gap:32px\">\n    <div style=\"display:flex;flex-direction:column;gap:10px;max-width:640px\">\n      <x-import component-from-global-scope=\"MomentumDesignSystem_e7efaa.CapsLabel\" hint-size=\"160px,14px\">Three ways to stand it up<\u002Fx-import>\n      <h2 style=\"margin:0;font-family:var(--font-display);font-size:clamp(34px,4.4vw,46px);font-weight:800;letter-spacing:-.04em;line-height:1.02;text-wrap:balance\">Fold it, stand it, get back to work.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px\">\n      <x-import component-from-global-scope=\"MomentumDesignSystem_e7efaa.GlassCard\" variant=\"panel\" padding=\"22px\" hint-size=\"100%,440px\">\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"aspect-ratio:760/520;position:relative;overflow:hidden\"><div style=\"position:absolute;left:0;top:0;zoom:.46\"><dc-import name=\"DuoRender\" pose=\"tent\" sign=\"countdown\" hint-size=\"760px,600px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.025em\">Designed for iPhone Duo<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.5;color:rgba(11,12,14,.62)\">The outer display faces the room. The sign changes when your meeting starts, and again when it ends.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fx-import>\n      <x-import component-from-global-scope=\"MomentumDesignSystem_e7efaa.GlassCard\" variant=\"panel\" padding=\"22px\" hint-size=\"100%,440px\">\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"aspect-ratio:760/520;position:relative;overflow:hidden\"><div style=\"position:absolute;left:0;top:0;width:760px;height:520px;zoom:.46\">\n            <div style=\"position:absolute;left:30px;top:99px;width:700px;height:322px;box-sizing:border-box;padding:11px;border-radius:66px;background:linear-gradient(160deg,#E6E1DA,#A9A39A 50%,#6E6960);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 30px 60px rgba(8,40,52,.28)\">\n              <div style=\"position:relative;width:100%;height:100%;border-radius:56px;background:#000;overflow:hidden\">\n                <div style=\"position:absolute;left:50%;top:0;width:537px;height:380px;margin-left:-268.5px;transform-origin:50% 0;transform:scale(.789)\"><dc-import name=\"DvdSign\" variant=\"trail\" offset=\"6\" hint-size=\"537px,380px\"><\u002Fdc-import><\u002Fdiv>\n                <div style=\"position:absolute;left:16px;top:50%;width:30px;height:104px;margin-top:-52px;border-radius:99px;background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.06)\"><\u002Fdiv>\n                <div style=\"position:absolute;inset:0;border-radius:56px;background:linear-gradient(115deg,rgba(255,255,255,.12),rgba(255,255,255,0) 35%);pointer-events:none\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.025em\">Trailblazing Ways to Let People Know You're Busy<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.5;color:rgba(11,12,14,.62)\">Several fun, questionably-useful ways to let people know you're in a meeting.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fx-import>\n      <x-import component-from-global-scope=\"MomentumDesignSystem_e7efaa.GlassCard\" variant=\"panel\" padding=\"22px\" hint-size=\"100%,440px\">\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"aspect-ratio:760/520;display:flex;align-items:center;justify-content:center\">\n            <div style=\"width:88%;aspect-ratio:2.1;border-radius:34px;padding:5px;box-sizing:border-box;background:linear-gradient(160deg,#F4F5F6,#B9BDC1 55%,#7E8388);box-shadow:0 18px 44px rgba(8,40,52,.22)\">\n              <div style=\"height:100%;border-radius:29px;background:#000;padding:14px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n                <div style=\"border-radius:18px;background:#1C1D20;padding:12px;display:flex;flex-direction:column;justify-content:space-between;color:#fff\"><div style=\"font-size:10.5px;font-weight:700;letter-spacing:.13em;color:#FF6B5A\">IN A CALL<\u002Fdiv><div style=\"font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:-.04em\">Busy<\u002Fdiv><\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;justify-content:center;color:#FF6B5A\"><div style=\"font-family:var(--font-display);font-size:40px;font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums\">14:48<\u002Fdiv><div style=\"font-size:13.5px;font-weight:600\">Wed 9 Sep<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.025em\">StandBy, on any iPhone<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.5;color:rgba(11,12,14,.62)\">No Duo? Works with any iPhone - just don't try tent mode 😉<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"position:relative;max-width:1160px;margin:0 auto;padding:72px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:40px;align-items:center\">\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <x-import component-from-global-scope=\"MomentumDesignSystem_e7efaa.CapsLabel\" hint-size=\"160px,14px\">Reads your calendar<\u002Fx-import>\n      <h2 style=\"margin:0;font-family:var(--font-display);font-size:clamp(34px,4.4vw,46px);font-weight:800;letter-spacing:-.04em;line-height:1.02;text-wrap:balance\">The sign changes on its own.<\u002Fh2>\n      <p style=\"margin:0;font-size:15px;line-height:1.55;color:rgba(11,12,14,.62);max-width:440px;text-wrap:pretty\">Any event with a video link puts up the sign. Fifteen minutes before the end it turns amber. When it’s over it says come in, and lists who knocked while you were busy.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;align-items:center\"><div style=\"font-family:var(--font-display);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums\">14:00<\u002Fdiv><div style=\"border-radius:24px;background:#D93A2B;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\"><div style=\"font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:-.038em\">In a call<\u002Fdiv><div style=\"font-size:13.5px;font-weight:600\">Design review · back at 15:30<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;align-items:center\"><div style=\"font-family:var(--font-display);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums\">15:15<\u002Fdiv><div style=\"border-radius:24px;background:#D0682E;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\"><div style=\"font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:-.038em\">Wrapping up<\u002Fdiv><div style=\"font-size:13.5px;font-weight:600\">Out in 15 minutes<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;align-items:center\"><div style=\"font-family:var(--font-display);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums\">15:30<\u002Fdiv><div style=\"border-radius:24px;background:#1E9E57;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\"><div style=\"font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:-.038em\">Free.<\u002Fdiv><div style=\"font-size:13.5px;font-weight:600\">Come in · 2 knocks waiting<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"signs\" style=\"position:relative;max-width:1160px;margin:0 auto;padding:72px 24px;display:flex;flex-direction:column;gap:32px\">\n    <div style=\"display:flex;flex-direction:column;gap:10px;max-width:640px\">\n      <x-import component-from-global-scope=\"MomentumDesignSystem_e7efaa.CapsLabel\" hint-size=\"160px,14px\">46 signs<\u002Fx-import>\n      <h2 style=\"margin:0;font-family:var(--font-display);font-size:clamp(34px,4.4vw,46px);font-weight:800;letter-spacing:-.04em;line-height:1.02;text-wrap:balance\">Sensible ones, and the rest.<\u002Fh2>\n      <p style=\"margin:0;font-size:15px;line-height:1.55;color:rgba(11,12,14,.62);text-wrap:pretty\">Three are free. The others come in packs of two to four, and every one of them animates through the meeting. These four are running live: one meeting, played in 30 seconds.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px\">\n      <sc-for list=\"{{ live }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"border-radius:24px;box-shadow:0 30px 80px rgba(8,40,52,.18)\"><dc-import name=\"LiveSign\" sign=\"{{ s.key }}\" offset=\"{{ s.off }}\" style=\"width:100%\" hint-size=\"100%,300px\"><\u002Fdc-import><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:8px;font-size:13.5px\"><div style=\"font-weight:700\">{{ s.name }}<\u002Fdiv><div style=\"color:rgba(11,12,14,.5)\">{{ s.pack }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px\">\n      <sc-for list=\"{{ signs }}\" as=\"g\" hint-placeholder-count=\"12\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"border-radius:20px;box-shadow:0 6px 20px rgba(11,40,50,.1)\"><dc-import name=\"LiveSign\" sign=\"{{ g.key }}\" offset=\"{{ g.off }}\" style=\"width:100%\" hint-size=\"100%,150px\"><\u002Fdc-import><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:8px;font-size:13.5px\"><div style=\"font-weight:700\">{{ g.name }}<\u002Fdiv><div style=\"color:rgba(11,12,14,.5)\">{{ g.pack }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"position:relative;max-width:1160px;margin:0 auto;padding:72px 24px\">\n    <div style=\"position:relative;border-radius:30px;overflow:hidden;background:linear-gradient(168deg,#123543,#061219);color:#fff;padding:clamp(28px,5vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:32px;align-items:center;box-shadow:0 14px 34px rgba(6,26,34,.3)\">\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-size:11.5px;font-weight:700;letter-spacing:.13em;color:#5ED2F0\">FREE MAC APP · OPTIONAL<\u002Fdiv>\n        <h2 style=\"margin:0;font-family:var(--font-display);font-size:clamp(34px,4.4vw,46px);font-weight:800;letter-spacing:-.04em;line-height:1.02;text-wrap:balance\">Mute without finding the window.<\u002Fh2>\n        <p style=\"margin:0;font-size:15px;line-height:1.55;color:rgba(255,255,255,.72);max-width:420px;text-wrap:pretty\">Add the free Mac menu-bar app and the phone controls your Zoom, Meet or Teams call. In laptop mode the buttons sit on the flat half, next to your keyboard.<\u002Fp>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <div style=\"padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);font-size:13.5px;font-weight:600\">Zoom<\u002Fdiv>\n          <div style=\"padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);font-size:13.5px;font-weight:600\">Google Meet<\u002Fdiv>\n          <div style=\"padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);font-size:13.5px;font-weight:600\">Teams<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:100%;max-width:560px;aspect-ratio:760/600;position:relative;justify-self:center\">\n        <div style=\"position:absolute;left:0;top:0;zoom:.73\"><dc-import name=\"DuoRender\" pose=\"laptop\" sign=\"yourside\" flat=\"controls\" hint-size=\"760px,600px\"><\u002Fdc-import><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"pricing\" style=\"position:relative;max-width:1160px;margin:0 auto;padding:72px 24px;display:flex;flex-direction:column;gap:32px\">\n    <div style=\"display:flex;flex-direction:column;gap:10px;max-width:640px\">\n      <x-import component-from-global-scope=\"MomentumDesignSystem_e7efaa.CapsLabel\" hint-size=\"160px,14px\">Pricing<\u002Fx-import>\n      <h2 style=\"margin:0;font-family:var(--font-display);font-size:clamp(34px,4.4vw,46px);font-weight:800;letter-spacing:-.04em;line-height:1.02\">Free to put up. Pay for the fun ones.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px\">\n      <x-import component-from-global-scope=\"MomentumDesignSystem_e7efaa.GlassCard\" variant=\"panel\" padding=\"24px\" hint-size=\"100%,300px\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.025em\">Free<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1\">£0<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.6;color:rgba(11,12,14,.62)\">Busy, Free and Loading bar signs<br>One calendar<br>StandBy widget and Live Activity<br><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fx-import>\n      <x-import component-from-global-scope=\"MomentumDesignSystem_e7efaa.GradientCard\" padding=\"24px\" hint-size=\"100%,300px\">\n        <div style=\"display:flex;flex-direction:column;gap:12px;color:#fff\">\n          <div style=\"font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.025em\">Pro<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1\">£6.99<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.6;color:rgba(255,255,255,.85)\">All calendars and rules<br>Sign editor<br>Mute and camera from the phone<br>Countdown and traffic light signs<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fx-import>\n      <x-import component-from-global-scope=\"MomentumDesignSystem_e7efaa.GlassCard\" variant=\"panel\" padding=\"24px\" hint-size=\"100%,300px\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.025em\">Sign packs<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1\">£1.99 <span style=\"font-size:19px;font-weight:600;letter-spacing:-.02em;color:rgba(11,12,14,.5)\">each (contains 4 signs)<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.6;color:rgba(11,12,14,.62)\">Arcade, Retro, Travel, Night, Errands, Broadcast, Glitch, Screen saver, Home, Sport, Nature, Characters<br>All packs £4.99, including future ones<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"position:relative;max-width:1160px;margin:0 auto;padding:40px 24px 56px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid rgba(11,12,14,.09);font-size:13.5px;color:rgba(11,12,14,.5)\">\n    <div>Callsign · 2026<\u002Fdiv>\n    <div style=\"display:flex;gap:20px\"><a href=\"#\">Support<\u002Fa><a href=\"#\">Privacy<\u002Fa><a href=\"#\">Press kit<\u002Fa><\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { i: 0, ls: 0.8 };\n  liveRef = el => {\n    if (this._ro) this._ro.disconnect();\n    if (!el) return;\n    this._ro = new ResizeObserver(() => { const s = el.clientWidth / 537; if (Math.abs(s - this.state.ls) > .005) this.setState({ ls: s }); });\n    this._ro.observe(el);\n  };\n  componentDidMount() { this.startAuto(); }\n  startAuto() { clearInterval(this._t); this._t = setInterval(() => this.setState(s => ({ i: (s.i + 1) % 6 })), 5000); }\n  go(i) { this.setState({ i: (i + 6) % 6 }); this.startAuto(); }\n  componentWillUnmount() { clearInterval(this._t); if (this._ro) this._ro.disconnect(); }\n  renderVals() {\n    const H = [\n      ['busy', '#D93A2B', 'Design review · until 15:30'],\n      ['countdown', '#D93A2B', 'Countdown · 23:41 left'],\n      ['flap', '#D0682E', 'Split-flap · back 15:30'],\n      ['neon', '#D93A2B', 'Neon · closed until 15:30'],\n      ['dvd', '#D93A2B', 'Screen saver · bouncing until 15:30'],\n      ['free', '#1E9E57', 'Free · come in']\n    ][this.state.i];\n    const M = 'ui-monospace,Menlo,monospace', D = 'var(--font-display)';\n    const g = (big, name, pack, bg, fg, font, glow) => ({ big, name, pack, bg, fg, font: font || D, glow: glow || 'none' });\n    return {\n      hero: { sign: H[0], dot: H[1], label: H[2] },\n      swipe: { down: e => { this._x = e.clientX; }, up: e => { if (this._x == null) return; const dx = e.clientX - this._x; this._x = null; if (Math.abs(dx) > 40) this.go(this.state.i + (dx < 0 ? 1 : -1)); } },\n      dots: [0, 1, 2, 3, 4, 5].map(k => ({ go: () => this.go(k), w: k === this.state.i ? '22px' : '8px', bg: k === this.state.i ? '#0B0C0E' : 'rgba(11,12,14,.18)' })),\n      liveRef: this.liveRef, liveScale: this.state.ls,\n      live: [\n        { key: 'countdown', name: 'Countdown', pack: 'Pro', off: 0 },\n        { key: 'flap', name: 'Split-flap', pack: 'Travel', off: 6 },\n        { key: 'hud', name: 'Game HUD', pack: 'Glitch', off: 12 },\n        { key: 'elevator', name: 'Elevator', pack: 'Errands', off: 18 }\n      ],\n      signs: [\n        { key: 'busy', name: 'Busy', pack: 'Free', off: 3 },\n        { key: 'loading', name: 'Loading bar', pack: 'Free', off: 9 },\n        { key: 'neon', name: 'Neon', pack: 'Night', off: 15 },\n        { key: 'onair', name: 'On air', pack: 'Night', off: 21 },\n        { key: 'human', name: 'Not responding', pack: 'Retro', off: 5 },\n        { key: 'score', name: 'Scoreboard', pack: 'Arcade', off: 11 },\n        { key: 'weather', name: 'Weather', pack: 'Broadcast', off: 17 },\n        { key: 'tama', name: '?', pack: 'Glitch', off: 23 }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
